name: macbec_solar_app
description: Aplicación interna local-first para gestión de proyectos solares de MacBec.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Base local local-first
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Persistencia ligera y seguridad
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Archivos, imágenes y documentos
  file_picker: ^8.1.2
  excel: ^4.0.6
  xml: ^6.5.0
  archive: ^3.6.1
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.3
  share_plus: ^10.0.2

  # Utilidades
  uuid: ^4.5.0
  intl: ^0.19.0
  collection: ^1.18.0
  crypto: ^3.0.7

  cupertino_icons: ^1.0.8
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.3
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/seeds/
    - assets/images/logo/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon_black.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon_black.png"
    background_color: "#000000"
    theme_color: "#000000"
